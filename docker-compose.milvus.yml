# 本地开发用 Milvus；外部 Milvus/Zilliz Cloud 不需要启动此文件。
# 启动：docker compose -f docker-compose.milvus.yml up -d
services:
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: jobintel-milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >-
      etcd
      --advertise-client-urls=http://milvus-etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - jobintel-milvus-etcd:/etcd

  milvus-minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: jobintel-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - jobintel-milvus-minio:/minio_data

  milvus:
    image: milvusdb/milvus:v2.6.5
    container_name: jobintel-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - jobintel-milvus-data:/var/lib/milvus
    depends_on:
      - milvus-etcd
      - milvus-minio

volumes:
  jobintel-milvus-etcd:
  jobintel-milvus-minio:
  jobintel-milvus-data:
